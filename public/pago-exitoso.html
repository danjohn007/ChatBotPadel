<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pago Exitoso - AroSports</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: linear-gradient(135deg, #114fbc 0%, #0a3380 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .card { background: white; border-radius: 20px; padding: 40px 30px; max-width: 420px; width: 100%; text-align: center; box-shadow: 0 20px 60px rgba(0,0,0,0.2); }
    .icon { font-size: 64px; margin-bottom: 16px; }
    h1 { color: #1a1a1a; font-size: 24px; margin-bottom: 8px; }
    p { color: #666; font-size: 16px; line-height: 1.5; margin-bottom: 24px; }
    .highlight { color: #25D366; font-weight: 600; }
    .btn { display: inline-block; background: #25D366; color: white; text-decoration: none; padding: 14px 32px; border-radius: 12px; font-size: 16px; font-weight: 600; transition: background 0.2s; }
    .btn:hover { background: #1da851; }
    .footer { margin-top: 20px; font-size: 13px; color: #999; }
    .legal-links { margin-top: 24px; display: flex; flex-direction: column; gap: 10px; }
    .legal-links a { color: #114fbc; text-decoration: none; font-size: 14px; font-weight: 500; }
    .legal-links a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">✅</div>
    <h1>¡Pago Exitoso!</h1>
    <p>Tu pago ha sido procesado correctamente. Recibirás la <span class="highlight">confirmación de tu reserva por WhatsApp</span> en unos momentos.</p>
    <p style="font-size: 14px; color: #888;">Ya puedes cerrar esta ventana y volver a WhatsApp.</p>
    <div class="legal-links">
      <a href="/aviso-privacidad.pdf" target="_blank">📄 Revisar aviso de privacidad</a>
      <a href="/terminos-condiciones.pdf" target="_blank">📄 Revisar términos y condiciones</a>
    </div>
    <div class="footer">AroSports &copy; 2026</div>
  </div>
</body>
</html>
