<!DOCTYPE html>

  <div class="card">
    <div class="icon">❌</div>
    <h1>Pago Cancelado</h1>

    <p style="font-size: 14px; color: #888;">Puedes volver a WhatsApp e intentar reservar de nuevo escribiendo <strong>"Hola"</strong>.</p>
    <div class="footer">AroSports &copy; 2026</div>
